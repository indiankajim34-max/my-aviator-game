<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator - Master Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 450px; width: 100%; display: flex; flex-direction: column; gap: 15px; }
        h2 { color: #ff334b; text-align: center; margin-bottom: 5px; font-size: 20px; }
        
        .card { background: #181c24; border: 1px solid #2a2e39; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .card label { font-size: 13px; color: #a0aec0; font-weight: bold; }
        
        input[type="time"], input[type="number"] { width: 100%; background: #0b0e14; border: 1px solid #2a2e39; border-radius: 8px; color: #fff; padding: 12px; font-size: 18px; text-align: center; outline: none; font-weight: bold; }
        
        .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .btn-primary { background: #00b894; color: white; box-shadow: 0 4px 0 #00886a; }
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #00886a; }
        
        .status-box { background: #212631; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>👑 Master Admin Panel</h2>
        
        <div class="card">
            <label>Current Status</label>
            <div class="status-box" id="currentSetStatus">No Timed Crash Set (Random Mode Active)</div>
        </div>

        <!-- Timed Crash Controller -->
        <div class="card">
            <label>Set Time-Based Crash (e.g., 10:25)</label>
            <input type="time" id="targetTimeInput">
            
            <label style="margin-top: 5px;">Target Crash Multiplier (e.g., 100.00x)</label>
            <input type="number" id="targetMultiplierInput" step="0.1" value="10.00">
            
            <button class="btn btn-primary" style="margin-top: 5px;" onclick="saveTimedCrash()">Save Timed Crash Control</button>
            <button class="btn" style="background:#e17055; color:#fff; margin-top:5px;" onclick="clearTimedCrash()">Clear / Reset to Random</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://aviatorgamepro-aaf06-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function saveTimedCrash() {
            const timeVal = document.getElementById('targetTimeInput').value;
            const multVal = parseFloat(document.getElementById('targetMultiplierInput').value);

            if (!timeVal || !multVal) {
                alert("Please enter both valid time and multiplier!");
                return;
            }

            db.ref('adminSettings').set({
                targetTime: timeVal,
                crashMultiplier: multVal
            }, (error) => {
                if (error) {
                    alert("Failed to save!");
                } else {
                    alert(`Success! At ${timeVal}, the game will hit exactly ${multVal}x.`);
                }
            });
        }

        function clearTimedCrash() {
            db.ref('adminSettings').remove(() => {
                alert("Timed crash cleared! Game is back to random mode.");
            });
        }

        db.ref('adminSettings').on('value', (snapshot) => {
            const data = snapshot.val();
            const statusBox = document.getElementById('currentSetStatus');
            if (data && data.targetTime && data.crashMultiplier) {
                statusBox.style.color = "#00b894";
                statusBox.innerText = `Active Target: At ${data.targetTime} -> Crash will be ${data.crashMultiplier}x`;
            } else {
                statusBox.style.color = "#f1c40f";
                statusBox.innerText = "No Timed Crash Set (Random Mode Active)";
            }
        });
    </script>
</body>
</html>
