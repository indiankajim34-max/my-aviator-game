<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro Demo with Canvas & Admin</title>
    <style>
        body { background: #0b0f19; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; text-align: center; }
        .game-container { background: #151b2b; border-radius: 16px; padding: 15px; max-width: 420px; margin: auto; box-shadow: 0 8px 20px rgba(0,0,0,0.6); border: 1px solid #1e293b; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; color: #94a3b8; }
        
        /* Game Screen Canvas Area */
        .screen-box { position: relative; height: 200px; background: #07090e; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        canvas { display: block; width: 100%; height: 100%; }
        .multiplier-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 42px; font-weight: 900; color: #facc15; text-shadow: 0 0 15px rgba(250, 204, 21, 0.5); pointer-events: none; }
        .status-text { position: absolute; top: 10px; left: 12px; font-size: 13px; font-weight: bold; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }

        /* Controls */
        .bet-section { margin-top: 15px; background: #1e293b; padding: 12px; border-radius: 10px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        input, button { padding: 12px; font-size: 16px; border-radius: 8px; border: none; outline: none; font-weight: bold; }
        input { flex: 1; background: #0f172a; color: #fff; text-align: center; border: 1px solid #475569; }
        button { flex: 1; background: #22c55e; color: #fff; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.97); }
        button.cashout { background: #ef4444; }
        
        .wallet-bar { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; margin-top: 8px; color: #cbd5e1; }

        /* Admin Panel */
        .admin-panel { margin-top: 20px; background: #090d16; padding: 12px; border-radius: 10px; border: 1px dashed #ef4444; text-align: left; }
        .admin-panel h3 { margin: 0 0 10px 0; font-size: 15px; color: #f87171; text-align: center; }
        .admin-group { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .admin-group input, .admin-group select { width: 110px; padding: 6px; font-size: 13px; background: #1e293b; color: #fff; border-radius: 4px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <span>✈️ Aviator Pro Demo</span>
            <span id="liveStatusTime" style="color: #22c55e;">● Live Server</span>
        </div>
        
        <!-- Game Screen with Canvas (Plane Animation) -->
        <div class="screen-box">
            <div class="status-text" id="gameStatus">Waiting for takeoff...</div>
            <canvas id="gameCanvas"></canvas>
            <div class="multiplier-overlay" id="multiplierDisplay">1.00x</div>
        </div>

        <!-- Betting Controls -->
        <div class="bet-section">
            <div class="input-group">
                <input type="number" id="betAmount" placeholder="Amount (₹)" value="50">
                <button id="actionBtn" onclick="handleUserAction()">PLACE BET</button>
            </div>
            <div class="wallet-bar">
                <span>Balance: ₹<span id="userBalance">1000</span></span>
                <span>Win: ₹<span id="winAmount">0</span></span>
            </div>
        </div>

        <!-- Admin Control Panel -->
        <div class="admin-panel">
            <h3>⚙️ Owner / Admin Control</h3>
            <div class="admin-group">
                <label>Next Crash Multiplier:</label>
                <input type="number" id="adminCustomCrash" step="0.1" placeholder="Auto / e.g. 2.5">
            </div>
            <div class="admin-group">
                <label>House Edge Mode:</label>
                <select id="adminMode">
                    <option value="smart">Smart House Edge (80% Low Crash)</option>
                    <option value="instant_crash">Instant Crash (1.00x - Owner Wins)</option>
                    <option value="jackpot">Force High Jackpot</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        let balance = 1000;
        let currentBet = 0;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let isPlaying = false;
        let isWaiting = true;
        let targetCrash = 1.00;
        let flightProgress = 0;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const gameStatus = document.getElementById('gameStatus');
        const actionBtn = document.getElementById('actionBtn');
        const betInput = document.getElementById('betAmount');
        const balanceDisplay = document.getElementById('userBalance');
        const winDisplay = document.getElementById('winAmount');
        const adminCustomCrash = document.getElementById('adminCustomCrash');
        const adminMode = document.getElementById('adminMode');

        // Resize Canvas dynamically
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Web Audio API for sound effects (No external files needed)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'start') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'cashout') {
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'crash') {
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // Draw Canvas Graphics (Plane & Curve)
        function drawScene(progress, multiplier, crashed) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 30) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            if (isWaiting) {
                ctx.fillStyle = '#64748b';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText("Next flight starting soon...", canvas.width / 2, canvas.height / 2);
                return;
            }

            // Draw Curve Line
            let endX = canvas.width * 0.8 * Math.min(progress, 1);
            let endY = canvas.height - (canvas.height * 0.8 * Math.min(progress, 1));

            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            ctx.quadraticCurveTo(endX * 0.5, canvas.height - 10, endX, endY);
            ctx.strokeStyle = crashed ? '#ef4444' : '#ef4444';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Draw Plane Icon at the tip of the curve
            if (!crashed) {
                ctx.font = '24px Arial';
                ctx.fillText('✈️', endX - 10, endY + 8);
            } else {
                ctx.font = '24px Arial';
                ctx.fillStyle = '#ef4444';
                ctx.fillText('💥 CRASHED', endX - 30, endY);
            }
        }

        // Countdown / Start Round
        setTimeout(startCountdown, 1500);

        function startCountdown() {
            isWaiting = true;
            gameStatus.innerText = "Taking off in 3s...";
            multiplierDisplay.innerText = "1.00x";
            multiplierDisplay.style.color = "#facc15";
            drawScene(0, 1.00, false);

            let count = 3;
            let cdInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    gameStatus.innerText = `Taking off in ${count}s...`;
                } else {
                    clearInterval(cdInterval);
                    startFlight();
                }
            }, 1000);
        }

        function startFlight() {
            isWaiting = false;
            gameStatus.innerText = "FLYING";
            currentMultiplier = 1.00;
            flightProgress = 0;
            playSound('start');

            targetCrash = calculateCrashPoint();

            gameInterval = setInterval(() => {
                currentMultiplier += 0.02;
                flightProgress += 0.015;

                multiplierDisplay.innerText = currentMultiplier.toFixed(2) + 'x';
                drawScene(flightProgress, currentMultiplier, false);

                // Live update potential winnings if user is playing
                if (isPlaying) {
                    let liveWin = Math.floor(currentBet * currentMultiplier);
                    winDisplay.innerText = liveWin;
                }

                if (currentMultiplier >= targetCrash) {
                    crashGame();
                }
            }, 80);
        }

        function calculateCrashPoint() {
            let mode = adminMode.value;
            let customVal = parseFloat(adminCustomCrash.value);

            if (!isNaN(customVal) && customVal >= 1.00) {
                return customVal; // Admin manual override
            }

            if (mode === "instant_crash") {
                return parseFloat((1.00 + Math.random() * 0.03).toFixed(2));
            } else if (mode === "jackpot") {
                return parseFloat((15.0 + Math.random() * 35.0).toFixed(2));
            } else {
                // Smart House Edge: 80% low crash, 20% medium/high
                let rnd = Math.random();
                if (rnd < 0.80) {
                    return parseFloat((1.00 + Math.random() * 0.35).toFixed(2));
                } else {
                    return parseFloat((1.36 + Math.random() * 5.50).toFixed(2));
                }
            }
        }

        function crashGame() {
            clearInterval(gameInterval);
            playSound('crash');
            gameStatus.innerText = "FALED / CRASHED";
            multiplierDisplay.style.color = "#ef4444";
            drawScene(flightProgress, currentMultiplier, true);

            if (isPlaying) {
                // User failed to cash out -> Lost bet
                isPlaying = false;
                actionBtn.innerText = "PLACE BET";
                actionBtn.className = "";
                winDisplay.innerText = "0";
            }

            // Wait 4 seconds then start next round countdown
            setTimeout(() => {
                startCountdown();
            }, 4000);
        }

        function handleUserAction() {
            let bet = parseFloat(betInput.value);

            if (isWaiting) {
                alert("Please wait for the next flight to start!");
                return;
            }

            if (!isPlaying) {
                // Place Bet action
                if (isNaN(bet) || bet <= 0) {
                    alert("Please enter a valid bet amount!");
                    return;
                }
                if (bet > balance) {
                    alert("Insufficient balance!");
                    return;
                }

                currentBet = bet;
                balance -= currentBet;
                balanceDisplay.innerText = balance;
                
                isPlaying = true;
                actionBtn.innerText = "CASH OUT";
                actionBtn.className = "cashout";
            } else {
                // Cash Out action
                playSound('cashout');
                let winnings = Math.floor(currentBet * currentMultiplier);
                balance += winnings;
                balanceDisplay.innerText = balance;
                
                alert(`Successfully Cashed Out! Won ₹${winnings}`);
                
                isPlaying = false;
                actionBtn.innerText = "PLACE BET";
                actionBtn.className = "";
                winDisplay.innerText = "0";
            }
        }
    </script>
</body>
</html>
