<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Pro - Live Game</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { background-color: #0b0e14; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #181c24; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2e39; }
        .logo { font-weight: bold; font-size: 16px; color: #ff334b; display: flex; align-items: center; gap: 5px; }
        .live-badge { background: #00b894; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        
        .game-container { flex: 1; display: flex; flex-direction: column; padding: 8px; gap: 8px; max-width: 500px; width: 100%; margin: 0 auto; overflow-y: auto; }
        
        .canvas-box { position: relative; width: 100%; height: 220px; background: #121620; border-radius: 12px; overflow: hidden; border: 1px solid #2a2e39; display: flex; justify-content: center; align-items: center; }
        canvas { width: 100%; height: 100%; display: block; }
        
        .multiplier-display { position: absolute; font-size: 38px; font-weight: bold; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); z-index: 5; pointer-events: none; }
        .status-text { position: absolute; top: 15px; font-size: 13px; font-weight: 600; color: #a0aec0; letter-spacing: 1px; z-index: 5; text-transform: uppercase; }

        .bets-wrapper { display: flex; flex-direction: column; gap: 8px; }
        .bet-panel { background: #181c24; border-radius: 12px; padding: 10px; border: 1px solid #2a2e39; display: flex; flex-direction: column; gap: 8px; }
        
        .bet-controls-top { display: flex; justify-content: space-between; align-items: center; }
        .amount-input-box { display: flex; align-items: center; background: #0b0e14; border: 1px solid #2a2e39; border-radius: 8px; overflow: hidden; width: 120px; }
        .amount-input-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 16px; font-weight: bold; text-align: center; padding: 6px; outline: none; }
        .amount-btn-adjust { background: #212631; color: #fff; border: none; padding: 6px 10px; font-weight: bold; cursor: pointer; }
        
        .quick-amounts { display: flex; gap: 4px; }
        .q-btn { background: #212631; border: 1px solid #2a2e39; color: #cbd5e1; font-size: 11px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-weight: 600; flex: 1; text-align: center; }
        .q-btn:active { background: #374151; }

        .bet-action-btn { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.1s; }
        .btn-bet { background: #00b894; color: white; box-shadow: 0 4px 0 #00886a; }
        .btn-bet:active { transform: translateY(2px); box-shadow: 0 2px 0 #00886a; }
        .btn-cancel { background: #e17055; color: white; box-shadow: 0 4px 0 #c0392b; }
        .btn-cashout { background: #f1c40f; color: #000; box-shadow: 0 4px 0 #d4ac0d; animation: pulse 0.8s infinite alternate; }

        .wallet-bar { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; padding: 0 4px; }
        .wallet-balance { color: #2ecc71; font-weight: bold; }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">✈️ Aviator Pro</div>
        <div class="live-badge">● LIVE</div>
    </header>

    <div class="game-container">
        <!-- Game Canvas / Screen -->
        <div class="canvas-box" id="canvasBox">
            <div class="status-text" id="statusText">WAITING FOR NEXT ROUND</div>
            <div class="multiplier-display" id="multiplierDisplay">1.00x</div>
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="wallet-bar">
            <span>Balance: <span class="wallet-balance" id="userBalance">₹1000</span></span>
            <span>Total Win: <span id="totalWin">₹0</span></span>
        </div>

        <!-- Bets Wrapper (Two Independent Panels) -->
        <div class="bets-wrapper">
            <!-- Bet Panel 1 -->
            <div class="bet-panel" id="panel1">
                <div class="bet-controls-top">
                    <div class="amount-input-box">
                        <button class="amount-btn-adjust" onclick="adjustAmount(1, -10)">-</button>
                        <input type="number" id="betInput1" value="100">
                        <button class="amount-btn-adjust" onclick="adjustAmount(1, 10)">+</button>
                    </div>
                    <div class="quick-amounts">
                        <div class="q-btn" onclick="setAmount(1, 50)">50</div>
                        <div class="q-btn" onclick="setAmount(1, 100)">100</div>
                        <div class="q-btn" onclick="setAmount(1, 500)">500</div>
                        <div class="q-btn" onclick="setAmount(1, 1000)">1000</div>
                    </div>
                </div>
                <button class="bet-action-btn btn-bet" id="actionBtn1" onclick="handleBetClick(1)">BET</button>
            </div>

            <!-- Bet Panel 2 -->
            <div class="bet-panel" id="panel2">
                <div class="bet-controls-top">
                    <div class="amount-input-box">
                        <button class="amount-btn-adjust" onclick="adjustAmount(2, -10)">-</button>
                        <input type="number" id="betInput2" value="100">
                        <button class="amount-btn-adjust" onclick="adjustAmount(2, 10)">+</button>
                    </div>
                    <div class="quick-amounts">
                        <div class="q-btn" onclick="setAmount(2, 50)">50</div>
                        <div class="q-btn" onclick="setAmount(2, 100)">100</div>
                        <div class="q-btn" onclick="setAmount(2, 500)">500</div>
                        <div class="q-btn" onclick="setAmount(2, 1000)">1000</div>
                    </div>
                </div>
                <button class="bet-action-btn btn-bet" id="actionBtn2" onclick="handleBetClick(2)">BET</button>
            </div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="soundTakeoff" src="https://assets.mixkit.co/active_storage/sfx/2878/2878-preview.mp3" preload="auto"></audio>
    <audio id="soundCashout" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>
    <audio id="soundCrash" src="https://assets.mixkit.co/active_storage/sfx/2658/2658-preview.mp3" preload="auto"></audio>

    <script>
        // Firebase Config
        const firebaseConfig = {
            databaseURL: "https://aviatorgamepro-aaf06-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let balance = 1000;
        let totalWinAmt = 0;

        // Bet states: 'IDLE', 'QUEUED', 'PLAYING', 'CASHOUT'
        let betState1 = 'IDLE'; 
        let betState2 = 'IDLE';
        let betAmount1 = 100;
        let betAmount2 = 100;

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function setAmount(panelId, amt) {
            document.getElementById(`betInput${panelId}`).value = amt;
        }

        function adjustAmount(panelId, val) {
            const input = document.getElementById(`betInput${panelId}`);
            let current = parseInt(input.value) || 0;
            current = Math.max(10, current + val);
            input.value = current;
        }

        function handleBetClick(panelId) {
            const inputVal = parseInt(document.getElementById(`betInput${panelId}`).value) || 100;
            
            if (panelId === 1) {
                if (betState1 === 'IDLE') {
                    if (balance < inputVal) { alert("Insufficient Balance!"); return; }
                    betAmount1 = inputVal;
                    balance -= betAmount1;
                    betState1 = 'QUEUED';
                    updateUI();
                } else if (betState1 === 'QUEUED') {
                    balance += betAmount1;
                    betState1 = 'IDLE';
                    updateUI();
                } else if (betState1 === 'PLAYING') {
                    // Cashout
                    let win = Math.floor(betAmount1 * currentMultiplier);
                    balance += win;
                    totalWinAmt += win;
                    document.getElementById('soundCashout').play().catch(()=>{});
                    betState1 = 'CASHOUT';
                    updateUI();
                }
            } else {
                if (betState2 === 'IDLE') {
                    if (balance < inputVal) { alert("Insufficient Balance!"); return; }
                    betAmount2 = inputVal;
                    balance -= betAmount2;
                    betState2 = 'QUEUED';
                    updateUI();
                } else if (betState2 === 'QUEUED') {
                    balance += betAmount2;
                    betState2 = 'IDLE';
                    updateUI();
                } else if (betState2 === 'PLAYING') {
                    // Cashout
                    let win = Math.floor(betAmount2 * currentMultiplier);
                    balance += win;
                    totalWinAmt += win;
                    document.getElementById('soundCashout').play().catch(()=>{});
                    betState2 = 'CASHOUT';
                    updateUI();
                }
            }
            document.getElementById('userBalance').innerText = '₹' + balance;
            document.getElementById('totalWin').innerText = '₹' + totalWinAmt;
        }

        function updateUI() {
            // Panel 1 UI
            const btn1 = document.getElementById('actionBtn1');
            const input1 = document.getElementById('betInput1');
            if (betState1 === 'IDLE') {
                btn1.innerText = "BET";
                btn1.className = "bet-action-btn btn-bet";
                input1.disabled = false;
            } else if (betState1 === 'QUEUED') {
                btn1.innerText = "CANCEL (QUEUED)";
                btn1.className = "bet-action-btn btn-cancel";
                input1.disabled = true;
            } else if (betState1 === 'PLAYING') {
                btn1.innerText = "CASHOUT";
                btn1.className = "bet-action-btn btn-cashout";
                input1.disabled = true;
            } else if (betState1 === 'CASHOUT') {
                btn1.innerText = "CASHED OUT";
                btn1.className = "bet-action-btn btn-bet";
                btn1.style.background = "#2d3748";
                input1.disabled = true;
            }

            // Panel 2 UI
            const btn2 = document.getElementById('actionBtn2');
            const input2 = document.getElementById('betInput2');
            if (betState2 === 'IDLE') {
                btn2.innerText = "BET";
                btn2.className = "bet-action-btn btn-bet";
                input2.disabled = false;
            } else if (betState2 === 'QUEUED') {
                btn2.innerText = "CANCEL (QUEUED)";
                btn2.className = "bet-action-btn btn-cancel";
                input2.disabled = true;
            } else if (betState2 === 'PLAYING') {
                btn2.innerText = "CASHOUT";
                btn2.className = "bet-action-btn btn-cashout";
                input2.disabled = true;
            } else if (betState2 === 'CASHOUT') {
                btn2.innerText = "CASHED OUT";
                btn2.className = "bet-action-btn btn-bet";
                btn2.style.background = "#2d3748";
                input2.disabled = true;
            }
        }

        // Game Engine Sync with Firebase / Logic
        let currentMultiplier = 1.00;
        let gameState = 'WAITING'; // WAITING, FLYING, CRASHED
        let crashPoint = 2.00;

        db.ref('gameState').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                gameState = data.status || 'WAITING';
                currentMultiplier = data.multiplier || 1.00;
                crashPoint = data.crashPoint || 2.00;
                
                renderGame();
            }
        });

        function renderGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Grid Background lines
            ctx.strokeStyle = '#1e2638';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let j=0; j<canvas.height; j+=40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            const multDisplay = document.getElementById('multiplierDisplay');
            const statusText = document.getElementById('statusText');

            if (gameState === 'WAITING') {
                multDisplay.innerText = "NEXT ROUND";
                multDisplay.style.color = "#a0aec0";
                statusText.innerText = "PLACE YOUR BETS";
                
                // Reset states if new round starts
                if(betState1 === 'CASHOUT') { betState1 = 'IDLE'; document.getElementById('actionBtn1').style.background = ''; }
                if(betState2 === 'CASHOUT') { betState2 = 'IDLE'; document.getElementById('actionBtn2').style.background = ''; }
                if(betState1 === 'QUEUED') { betState1 = 'PLAYING'; }
                if(betState2 === 'QUEUED') { betState2 = 'PLAYING'; }
                updateUI();

            } else if (gameState === 'FLYING') {
                multDisplay.innerText = currentMultiplier.toFixed(2) + 'x';
                multDisplay.style.color = "#fff";
                statusText.innerText = "FLYING AWAY...";

                // Draw curve & plane
                ctx.strokeStyle = '#ff334b';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                ctx.quadraticCurveTo(canvas.width * 0.6, canvas.height * 0.5, canvas.width * 0.9, canvas.height * 0.2);
                ctx.stroke();

                // Draw Plane icon at tip
                ctx.font = "24px Arial";
                ctx.fillText("✈️", canvas.width * 0.85, canvas.height * 0.22);

            } else if (gameState === 'CRASHED') {
                multDisplay.innerText = currentMultiplier.toFixed(2) + 'x';
                multDisplay.style.color = "#ff4757";
                statusText.innerText = "flew away!";

                // Auto fail uncashed bets
                if(betState1 === 'PLAYING') { betState1 = 'IDLE'; updateUI(); }
                if(betState2 === 'PLAYING') { betState2 = 'IDLE'; updateUI(); }
            }
        }
    </script>
</body>
</html>
